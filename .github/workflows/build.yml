name: Build

on:
  push:
  workflow_dispatch:

# Least privilege: every job only reads the repository. Jobs that need more must ask for it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the Dockerfile (node:24) and the GitLab iOS job (nvm 24).
  NODE_VERSION: '24'
  # Keep in sync with build/android/Dockerfile (openjdk-21).
  JAVA_VERSION: '21'
  NETLIFY_CLI_VERSION: '27.16.2'

jobs:
  test:
    name: 🧪 Test & Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Same as the GitLab unit job: the test toolchain lives in package.json#testDependencies,
      # which is swapped into devDependencies, so the lockfile cannot be frozen here.
      - name: 🔧 Install dependencies
        run: yarn install-test-dependencies && yarn install --non-interactive

      - name: 🧪 Test
        run: yarn test-ci

      - name: 🧹 Lint
        run: yarn lint-ci

      - name: 📦 Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: lintReport.json
          if-no-files-found: ignore
          retention-days: 14

  web:
    name: 🏗️ Build Web
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔧 Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: 🏗️ Build
        run: yarn prepare-prod-build && yarn build:prod

      - name: 📦 Upload www
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: www
          path: www
          if-no-files-found: error
          retention-days: 7

  deploy_preview:
    name: 🚀 Netlify Preview
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: web
    # Forks have neither the secrets nor any business deploying.
    if: ${{ github.repository == 'airgap-it/airgap-vault' }}

    steps:
      - name: ⬇️ Download www
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: www
          path: www

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Installed in its own step, without the Netlify token in the environment,
      # so no install script of the CLI's dependency tree ever sees it.
      - name: 🔧 Install Netlify CLI
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/netlify" "netlify-cli@$NETLIFY_CLI_VERSION"

      - name: 🚀 Deploy draft
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        # --no-build: www comes from the web job; without it the CLI runs the build command
        # configured in the Netlify UI, which this checkout-less job cannot.
        run: '"$RUNNER_TEMP/netlify/node_modules/.bin/netlify" deploy --no-build --dir=www --alias="$GITHUB_SHA" --message="$GITHUB_SHA"'

  android:
    name: 🤖 Build Android
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    needs: web

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: ⚙️ Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Capacitor's native plugin sources are resolved from node_modules.
      - name: 🔧 Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: ⬇️ Download www
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: www
          path: www

      - name: 🔄 Sync Android
        run: npx cap sync android

      - name: 🔨 Build
        working-directory: android
        run: ./gradlew clean build

      - name: 🔐 Sign debug APK
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk/airgap-vault-release-unsigned.apk
          "$build_tools/zipalign" -p -f 4 apk/airgap-vault-release-unsigned.apk apk/airgap-vault-debug.apk
          "$build_tools/apksigner" sign --ks build/android/debug.keystore --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android apk/airgap-vault-debug.apk

      - name: 📦 Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 14
