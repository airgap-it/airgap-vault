<ng-container>
  <ion-item
    [button]="enabled && checkboxValue === undefined"
    [disabled]="!enabled"
    lines="none"
    [detail]="checkboxValue === undefined"
    class="ion-no-padding"
    (click)="doAction()"
    [attr.aria-label]="checkboxValue === undefined ? accessibleLabel : null"
  >
    <ion-avatar slot="start">
      <div class="avatar--container" [ngClass]="active ? 'background--color__primary' : 'background--color__tertiary'">
        <ion-icon aria-hidden="true" [src]="icon"></ion-icon>
      </div>
    </ion-avatar>
    <ion-label color="white" class="ion-text-wrap">
      <ng-content></ng-content>
    </ion-label>
    <ion-checkbox
      *ngIf="checkboxValue !== undefined"
      slot="end"
      class="ion-no-margin"
      [ngModel]="checkboxValue"
      [disabled]="!enabled"
      (ionChange)="doAction()"
      [attr.aria-label]="accessibleLabel"
    ></ion-checkbox>
  </ion-item>

  <p *ngIf="!enabled">This setting is disabled. Import your secret again to change it.</p>
</ng-container>
