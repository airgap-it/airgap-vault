<ion-card
  button
  class="no-padding background--color__gradient"
  (click)="goToAccountsList()"
  [attr.aria-label]="'accessibility.open_secret' | translate: { label: secret.label }"
>
  <ion-card-header>
    <ion-row *ngIf="isAdvancedMode$ | async">
      <ion-col size="3">
        <img *ngIf="lifehashData" class="lifehash" [src]="lifehashData" alt="" aria-hidden="true" />
      </ion-col>
      <ion-col>
        <ion-card-title class="secret--label">
          {{ secret.label }}
        </ion-card-title>
      </ion-col>
    </ion-row>
    <ion-card-title *ngIf="!(isAdvancedMode$ | async)" class="secret--label">
      {{ secret.label }}
    </ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <ion-row [class]="secret.isParanoia || secret.hasSocialRecovery ? 'ion-padding-start_activated' : ''">
      <span class="airgap-currency-symbol-secret mtzero" *ngFor="let wallet of activeWallets">
        <airgap-currency-symbol [symbol]="wallet.symbol" [protocolIdentifier]="wallet.protocolIdentifier"></airgap-currency-symbol>
      </span>
      <span *ngIf="hasMoreWallets > 0" class="additional-wallet-count mtzero" aria-hidden="true">+{{ hasMoreWallets }}</span>
    </ion-row>

    <ion-fab *ngIf="secret.isParanoia || secret.hasSocialRecovery" vertical="bottom" horizontal="" slot="fixed">
      <ion-icon aria-hidden="true" *ngIf="secret.isParanoia" class="ion-icon_activated" name="shield"></ion-icon>
      <ion-icon aria-hidden="true" *ngIf="secret.hasSocialRecovery" class="ion-icon_activated" name="extension-puzzle"></ion-icon>
    </ion-fab>
  </ion-card-content>
</ion-card>
